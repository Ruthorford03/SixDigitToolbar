plugins {
    id "com.android.application"
}

android {
    namespace "tw.local.sixdigittoolbar"
    compileSdk 35

    defaultConfig {
        applicationId "tw.local.sixdigittoolbar"
        minSdk 23
        targetSdk 35
        versionCode 21
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
