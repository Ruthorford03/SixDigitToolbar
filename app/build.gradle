plugins {
    id "com.android.application"
}

android {
    namespace "tw.local.sixdigittoolbar"
    compileSdk 35

    defaultConfig {
        applicationId "tw.local.sixdigittoolbar"
        minSdk 23
        targetSdk 35
        versionCode 20
        versionName "2.9"
    }

    signingConfigs {
        release {
            storeFile file("../signing/nhentai-shortcut.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
